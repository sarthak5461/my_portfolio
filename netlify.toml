[build]
  base = "frontend"
  publish = "build"
  command = "yarn build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS    = "--version"
  CI           = "false"

# SPA fallback — every route serves index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Long-cache hashed static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Resume PDF — sensible caching
[[headers]]
  for = "/resume.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type  = "application/pdf"
